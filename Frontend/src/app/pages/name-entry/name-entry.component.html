<main
  class="min-h-dvh w-full overflow-x-hidden bg-gray-950 text-gray-100 flex flex-col items-center justify-center px-6 pt-safe pb-safe"
>
  <section class="w-full max-w-sm min-w-0 flex flex-col items-center text-center gap-6">
    <header class="flex flex-col items-center gap-3">
      <p class="text-xs font-bold tracking-[0.3em] uppercase text-neon-purple">
        {{ isHost() ? 'Nueva sala' : 'Unirse' }}
      </p>
      <h1 class="text-4xl sm:text-5xl font-black leading-none tracking-tight">
        {{ title() }}
      </h1>
      <p class="text-base text-gray-400 font-medium">{{ subtitle() }}</p>
    </header>

    <form class="w-full flex flex-col gap-4" (submit)="$event.preventDefault(); confirm()">
      <label for="nickname" class="sr-only">Tu apodo</label>

      <input
        id="nickname"
        name="nickname"
        type="text"
        inputmode="text"
        autocomplete="nickname"
        autocorrect="off"
        spellcheck="false"
        enterkeyhint="go"
        [attr.maxlength]="maxLength"
        [placeholder]="placeholder"
        class="nickname-input w-full py-6 px-4 text-center text-4xl font-black rounded-2xl
               bg-gray-900 text-white border-4 border-gray-800 placeholder:text-gray-700
               focus:outline-none focus:border-lime-400 focus:ring-4 focus:ring-lime-400
               transition-shadow"
        [class.border-red-500]="error()"
        [value]="nickname()"
        (input)="onNameInput($event)"
        aria-describedby="nickname-hint"
      />

      <p
        id="nickname-hint"
        class="text-sm text-gray-400 font-medium"
        [class.text-red-400]="error()"
        role="status"
        aria-live="polite"
      >
        {{ error() || 'Usa el nombre por el que te insultan tus amigos, no tu DNI.' }}
      </p>

      <button
        type="submit"
        class="btn-neon w-full py-6 px-8 text-2xl font-black uppercase tracking-wide rounded-2xl
               bg-lime-400 text-black shadow-[0_0_30px_rgba(163,230,53,0.35)]
               active:scale-[0.97] transition-transform duration-100
               disabled:opacity-55 disabled:shadow-none disabled:cursor-not-allowed"
        [disabled]="!canSubmit()"
      >
        {{ submitting() ? 'Entrando…' : cta() }}
      </button>
    </form>

    <button
      type="button"
      class="text-sm font-bold uppercase tracking-widest text-gray-600"
      (click)="back()"
    >
      Volver
    </button>
  </section>
</main>
